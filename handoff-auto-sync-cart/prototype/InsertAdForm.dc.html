<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng tin · tự động điền từ bài viết</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 375px; height: 812px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F4F4F4; color: #222222; font-family: 'Reddit Sans', -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px;">

  <!-- Header -->
  <div style="height: 52px; flex: none; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 56px; background: #FFFFFF; border-bottom: 1px solid #F4F4F4;">
    <button type="button" aria-label="Đóng" onClick="{{onClose}}" style="position: absolute; left: 8px; top: 6px; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: #222222; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">Đăng tin</h1>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 96px;">
    <!-- Banner tự động điền -->
    <div role="status" style="display: flex; gap: 10px; align-items: flex-start; margin: 12px 12px 0; padding: 12px; border-radius: 12px; background: #FFF8D6; border: 1px solid #FFD400;">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-top: 1px;"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="#CC8F00"></path><path d="M19 15.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z" fill="#CC8F00"></path></svg>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; line-height: 20px; font-weight: 700;">Đã tự động điền từ bài viết {{source}}</span>
        <span style="font-size: 12px; line-height: 18px; color: #595959;">Kiểm tra lại các thông tin có dấu <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align: -1px;"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="#CC8F00"></path></svg> trước khi đăng</span>
      </span>
    </div>

    <!-- Hình ảnh -->
    <section style="margin-top: 8px; padding: 16px; background: #FFFFFF;">
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
        <h2 style="margin: 0; flex: 1; font-size: 16px; line-height: 24px; font-weight: 700;">Hình ảnh <span style="font-weight: 400; color: #8C8C8C;">{{photoCount}}/12</span></h2>
        <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 18px; color: #CC8F00; font-weight: 600;"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="currentColor"></path></svg>Lấy từ bài viết</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <sc-for list="{{photos}}" as="ph" hint-placeholder-count="3">
          <span style="position: relative; width: 76px; height: 76px; flex: none; border-radius: 8px; overflow: hidden;">
            <img src="assets/9a7f19fb39f330221cf73341f7169994.png" alt="" style="width: 76px; height: 76px; object-fit: cover; display: block; filter: {{ph.filter}};">
            <sc-if value="{{ph.cover}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: rgba(34,34,34,0.7); color: #FFFFFF; font-size: 11px; line-height: 20px; font-weight: 600; text-align: center;">Ảnh bìa</span>
            </sc-if>
          </span>
        </sc-for>
        <span style="width: 76px; height: 76px; flex: none; box-sizing: border-box; border-radius: 8px; border: 1px dashed #C0C0C0; color: #8C8C8C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Thêm</span>
      </div>
    </section>

    <!-- Thông tin -->
    <section style="margin-top: 8px; padding: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 700;">Thông tin bất động sản</h2>
      <div style="display: flex; gap: 8px;">
        <sc-for list="{{wants}}" as="w" hint-placeholder-count="2">
          <span style="flex: 1; height: 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid {{w.bc}}; background: {{w.bg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: {{w.weight}};">{{w.label}}</span>
        </sc-for>
      </div>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <div style="min-height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid {{f.bc}}; background: #FFFFFF;">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
              <span style="font-size: 12px; line-height: 16px; color: #8C8C8C;">{{f.label}}</span>
              <span style="font-size: 14px; line-height: 20px; color: {{f.fg}}; white-space: {{f.ws}}; overflow: hidden; text-overflow: ellipsis;">{{f.value}}</span>
            </span>
            <sc-if value="{{f.auto}}" hint-placeholder-val="{{true}}">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-label="Tự động điền" style="flex: none;"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z" fill="#CC8F00"></path></svg>
            </sc-if>
            <sc-if value="{{f.select}}" hint-placeholder-val="{{false}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C8C8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M6 9l6 6 6-6"></path></svg>
            </sc-if>
          </div>
          <sc-if value="{{f.missing}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; line-height: 16px; color: #8C8C8C;">Bài viết chưa có thông tin này · không bắt buộc</span>
          </sc-if>
        </div>
      </sc-for>
    </section>
  </div>

  <!-- Thanh đáy -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 12px 16px 24px; background: #FFFFFF; box-shadow: 0 -4px 16px rgba(34,34,34,0.08);">
    <button type="button" style="width: 120px; flex: none; height: 48px; border-radius: 999px; border: 1px solid #DDDDDD; background: #FFFFFF; color: #222222; font: inherit; font-size: 16px; line-height: 24px; font-weight: 700; cursor: pointer;">Xem trước</button>
    <button type="button" onClick="{{onSubmit}}" style="flex: 1; height: 48px; border-radius: 999px; border: 0; background: #FFD400; color: #222222; font: inherit; font-size: 16px; line-height: 24px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;"><span data-spin="1" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(34,34,34,0.25); border-top-color: #222222; display: {{spin}};"></span>{{submitLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"post":{"editor":"enum","options":["0","1","2"],"default":"0","section":"Prototype"},"preset":{"editor":null,"default":""},"$preview":{"width":375,"height":812}}'>
// Dữ liệu điền sẵn theo từng bài viết (khớp PCARDS ở Quản lý tin)
const POSTS = [
  { source: 'Facebook', photos: 4, want: 'Bán', cat: 'Bất động sản › Căn hộ/Chung cư', title: 'Bán căn hộ 2PN Vinhomes Central Park view sông', price: '7,4 tỷ', area: '79 m²', rooms: '2 phòng ngủ · 2 phòng vệ sinh', legal: 'Sổ hồng', addr: 'Vinhomes Central Park, Phường 22, Bình Thạnh, Tp Hồ Chí Minh', code: '', desc: 'Bán căn hộ 2PN Vinhomes Central Park view sông, nội thất đầy đủ, sổ hồng chính chủ.' },
  { source: 'TikTok', photos: 3, want: 'Cho thuê', cat: 'Bất động sản › Nhà ở', title: 'Cho thuê nhà phố Gò Vấp 4x16m, 3PN, hẻm xe hơi', price: '15 triệu/tháng', area: '64 m²', rooms: '3 phòng ngủ · 3 phòng vệ sinh', legal: '', addr: 'Đường Quang Trung, Phường 10, Gò Vấp, Tp Hồ Chí Minh', code: '', desc: 'Cho thuê nhà phố Gò Vấp 4x16m, 3 phòng ngủ, hẻm xe hơi, gần chợ.' },
  { source: 'Facebook', photos: 3, want: 'Bán', cat: 'Bất động sản › Đất', title: 'Bán đất nền Nhà Bè 100m2 sổ riêng, đường ô tô 8m', price: '3,2 tỷ', area: '100 m²', rooms: '', legal: 'Sổ riêng', addr: 'Xã Phước Kiển, Nhà Bè, Tp Hồ Chí Minh', code: '', desc: 'Bán đất nền Nhà Bè 100m2 sổ riêng, đường ô tô 8m, gần trường học.' }
];

class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { sending: (this.props && this.props.preset) === 'sending' };
  }
  componentDidMount() {
    this.alive = true;
    const loop = (t) => {
      if (!this.alive) return;
      const els = document.querySelectorAll('[data-spin]');
      for (let i = 0; i < els.length; i++) els[i].style.transform = 'rotate(' + ((t * 0.4) % 360) + 'deg)';
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { this.alive = false; cancelAnimationFrame(this.raf); clearTimeout(this.t); }
  renderVals() {
    const k = Math.max(0, Math.min(2, parseInt(this.props.post, 10) || 0));
    const p = POSTS[k], s = this.state;
    const F = (label, value, opts) => {
      const o = opts || {}, has = !!value;
      return { label, value: has ? value : (o.ph || 'Nhập ' + label.toLowerCase()), fg: has ? '#222222' : '#C0C0C0', bc: '#DDDDDD',
        auto: has && !o.manual, missing: !has, select: !!o.select, ws: o.multi ? 'normal' : 'nowrap' };
    };
    const fields = [
      F('Danh mục', p.cat, { select: true }),
      F('Tiêu đề tin đăng', p.title),
      F('Giá', p.price),
      F('Diện tích', p.area),
      p.rooms ? F('Số phòng', p.rooms, { select: true }) : null,
      F('Giấy tờ pháp lý', p.legal, { select: true, ph: 'Chọn giấy tờ pháp lý' }),
      F('Địa chỉ', p.addr, { multi: true }),
      F('Mô tả chi tiết', p.desc, { multi: true })
    ].filter(Boolean);
    return {
      source: p.source, photoCount: p.photos,
      photos: Array.from({ length: p.photos }, (x, i) => ({ cover: i === 0, filter: ['none', 'hue-rotate(15deg) saturate(1.1)', 'brightness(0.92)', 'hue-rotate(-20deg)'][i % 4] })).slice(0, 3),
      wants: ['Bán', 'Cho thuê'].map((w) => ({ label: w, bg: w === p.want ? '#FFF8D6' : '#FFFFFF', bc: w === p.want ? '#FFD400' : '#DDDDDD', weight: w === p.want ? 700 : 400 })),
      fields,
      spin: s.sending ? 'inline-block' : 'none', submitLabel: s.sending ? 'Đang đăng tin' : 'Đăng tin',
      onClose: () => { if (this.props.onExit) this.props.onExit(); },
      onSubmit: () => {
        if (s.sending) return;
        this.setState({ sending: true });
        this.t = setTimeout(() => { if (!this.alive) return; this.setState({ sending: false }); if (this.props.onDone) this.props.onDone(k); }, 1100);
      }
    };
  }
}
</script>
</body>
</html>
