<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Prototype trang shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 375px; height: 868px; display: flex; flex-direction: column; overflow: hidden; background: #F7F7F7; color: #222222; font-family: 'Reddit Sans', -apple-system, 'Segoe UI', sans-serif;">
  <div style="height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #222222; color: #FFFFFF;">
    <div role="tablist" aria-label="Chọn trường hợp trang shop" style="flex: 1; min-width: 0; display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: #333333;">
      <sc-for list="{{cases}}" as="c" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="flex: 1; min-width: 0; height: 36px; padding: 0 4px; border: 0; border-radius: 8px; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; line-height: 16px; font-weight: {{c.fw}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;">{{c.label}}</button>
      </sc-for>
    </div>
    <button type="button" onClick="{{reset}}" aria-label="Chạy lại prototype từ đầu" style="flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #FFBA00; color: #222222; font: inherit; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"></path><path d="M4 4v4.5h4.5"></path></svg>
      Reset
    </button>
  </div>
  <div style="position: relative; width: 375px; height: 812px; flex: none; overflow: hidden; background: #FFFFFF;">
    <sc-if value="{{shopOn}}" hint-placeholder-val="{{true}}">
      <div style="position: absolute; inset: 0;">
        <dc-import name="ShopProfile" preset="{{preset}}" hint-size="375px,812px"></dc-import>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":868}}'>
// Prototype trang shop: chọn trường hợp ở thanh trên, công tắc đồng bộ bật/tắt ngay trong trang shop
const CASES = [
  ['seller-off', 'Chủ shop · chưa bật'],
  ['seller-on', 'Chủ shop · đã bật'],
  ['buyer', 'Khách xem shop']
];
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { preset: 'seller-off', shopOn: true };
  }
  restart(preset) {
    this.setState({ preset: preset || this.state.preset, shopOn: false });
    setTimeout(() => this.setState({ shopOn: true }), 20);
  }
  renderVals() {
    const s = this.state;
    return {
      preset: s.preset, shopOn: s.shopOn,
      cases: CASES.map(([key, label]) => {
        const on = key === s.preset;
        return { label, sel: String(on), bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#222222' : '#DDDDDD', fw: on ? 700 : 500,
          pick: () => { if (!on) this.restart(key); } };
      }),
      reset: () => this.restart()
    };
  }
}
</script>
</body>
</html>
